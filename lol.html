<!DOCTYPE html>
<html>
<body>
<script>
// Spawn one worker per logical core
const cores = navigator.hardwareConcurrency || 4;

for (let i = 0; i < cores; i++) {
  const worker = new Worker(URL.createObjectURL(new Blob([
    `
    function burn() {
      let x = 0;
      for (let i = 0; i < 1e7; i++) {
        x += Math.sqrt(i);
      }
      setTimeout(burn, 0);
    }
    burn();
    `
  ], { type: 'application/javascript' })));
}
</script>
</body>
</html>
